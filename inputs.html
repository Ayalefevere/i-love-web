<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/inputs.css">
    <title>Inputs</title>
</head>
<body>
   
    <form>
        <label>Time<input type="time" name="time" min="09:00" max="18:00"></label>
    </form>

    <form>
        <label>Number <input type="number" name="number" min="0" max="50" required></label>
    </form>

    <form>
        <label>Color <input type="color" name="color" value="#e66465"></label>
    </form>
    

</body>
</html>
